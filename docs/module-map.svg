  <path d="M440,320 V368" fill="none" stroke="#8a8d9b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M540,400 H640" fill="none" stroke="#8a8d9b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="453.4" y="110" width="37.2" height="12" fill="#f5f5f5"/>
  <text x="472" y="119.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, Consolas, 'Courier New', monospace" font-size="9.5" letter-spacing="0.6" fill="#5c6073">INIT</text>
  <rect x="278.0" y="156" width="44.0" height="12" fill="#f5f5f5"/>
