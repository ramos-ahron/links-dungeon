    <text x="72" y="514" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2d3142">state.py: one object holding every game variable</text>
    <text x="72" y="528" font-family="'Geist Mono', ui-monospace, Consolas, 'Courier New', monospace" font-size="10.5" fill="#5c6073">all modules read and write state.&lt;name&gt; (the ~275 globals of the original script)</text>
