    <text x="297" y="276.5" font-family="'Geist Mono', ui-monospace, Consolas, 'Courier New', monospace" font-size="9" letter-spacing="0.6" fill="#5c6073">GAMEPLAY</text>
    <text x="292" y="298" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2d3142">Player, physics, enemies</text>
    <text x="292" y="312" font-family="'Geist Mono', ui-monospace, Consolas, 'Courier New', monospace" font-size="10.5" fill="#5c6073">player.py · physics.py · enemies.py</text>
  </g>
  <g>
    <rect x="340" y="368" width="200" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="340" y="368" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
    <rect x="352" y="378" width="56" height="14" rx="2" fill="none" stroke="#8a8d9b" stroke-width="0.8"/>
    <text x="357" y="388.5" font-family="'Geist Mono', ui-monospace, Consolas, 'Courier New', monospace" font-size="9" letter-spacing="0.6" fill="#5c6073">SPRITES</text>
