<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 616" width="880" height="616" role="img" aria-labelledby="module-map-title module-map-desc">
  <title id="module-map-title">Link's Dungeon module map</title>
  <desc id="module-map-desc">main.py starts both levels, which run through the core loop in loop.py and use the shared gameplay, sprite and state modules; sprites load images from assets/.</desc>
